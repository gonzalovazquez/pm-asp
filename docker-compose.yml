# ============================================================
# Agentic Skills Platform (PM ASP) — POC stack
# ============================================================
# Services:
#   postgres      Skill Registry + Conversation + Artifact stores (pgvector)
#   redis         Session cache (see redis-key-patterns.md)
#   agentgateway  Single endpoint: LLM gateway (Anthropic) + MCP tool routing
#   n8n           Workflow engine (generate_prd_v1, summarize_requirements_v1)
#   n8n-import    One-shot: imports + activates the workflows, then exits
#   backend       FastAPI: API gateway + LLM intent router + skill dispatcher
#   frontend      Next.js chat UI
#
# The self-hosted Atlassian + GitHub MCP servers are NOT in this file — they run
# on your host and agentgateway reaches them via host.docker.internal.
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asp_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-asp}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Loaded once, on an empty data dir, in alphabetical order.
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asp} -d ${POSTGRES_DB:-asp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.3.1
    command: ["-f", "/config.yaml"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:4000"     # LLM endpoint (Anthropic /v1/messages)
      - "8081:3000"     # MCP endpoint (/mcp)
      - "15000:15000"   # admin UI
    extra_hosts:
      # Lets agentgateway reach MCP servers running on the host machine.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./gateway/agentgateway.yaml:/config.yaml:ro

  # One-shot: initialise n8n's DB, import the workflow JSON, activate them, exit.
  # Shares the n8n data volume so the main n8n container picks them up on start.
  n8n-import:
    image: n8nio/n8n:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        n8n import:workflow --separate --input=/backup/workflows &&
        for id in $$(n8n list:workflow --onlyId); do
          n8n publish:workflow --id="$$id" || true;
        done
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-poc-only-change-me-please-32chars+}
      DB_TYPE: sqlite
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/backup/workflows:ro

  n8n:
    image: n8nio/n8n:latest
    depends_on:
      n8n-import:
        condition: service_completed_successfully
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-poc-only-change-me-please-32chars+}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      N8N_SECURE_COOKIE: "false"
      # Where the workflows call the gateway (internal compose network).
      AGENTGATEWAY_URL: ${AGENTGATEWAY_URL:-http://agentgateway:4000}
      PRD_MODEL: ${PRD_MODEL:-claude-sonnet-5}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://asp:asp_dev_pw@postgres:5432/asp}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AGENTGATEWAY_URL: ${AGENTGATEWAY_URL:-http://agentgateway:4000}
      N8N_URL: ${N8N_URL:-http://n8n:5678}
      OFFLINE_MODE: ${OFFLINE_MODE:-1}
      ROUTER_MODEL: ${ROUTER_MODEL:-claude-haiku-4-5-20251001}
      PRD_MODEL: ${PRD_MODEL:-claude-sonnet-5}
      FRONTEND_ORIGIN: "http://localhost:3000"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  n8n_data:
